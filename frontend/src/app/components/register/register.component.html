<div class="header">
  <!--Content before waves-->
  <main class="form-signin w-100 m-auto">
    <div>
      <form
        #miFormulario="ngForm"
        [formGroup]="form"
        (ngSubmit)="getUser(miFormulario)"
        novalidate
      >
        <h2 class="h3 pt-4 mb-3 fw-normal">Register</h2>

        <div class="form-floating">
          <input
            formControlName="name"
            type="text"
            class="form-control"
            id="floatingInput"
            placeholder="Insert your name"
            name="name"
            [(ngModel)]="service.datosUser.name"
          />
          <label class="text-dark" for="floatingInput">Name</label>

          <div
            class="alert alert-danger mt-2"
            *ngIf="
              form.controls['name'].invalid &&
              (form.controls['name'].dirty || form.controls['name'].touched)
            "
          >
            <span> The name is required </span>
          </div>
        </div>

        <div class="mt-4 form-floating">
          <input
            formControlName="email"
            type="email"
            class="form-control"
            name="email"
            id="floatingInput"
            placeholder="name@example.com"
            [(ngModel)]="service.datosUser.email"
          />
          <label class="text-dark" for="floatingInput">Email Address</label>

          <div
            class="alert alert-danger mt-2"
            *ngIf="
              form.controls['email'].invalid &&
              (form.controls['email'].dirty || form.controls['email'].touched)
            "
          >
            <span> The email address is required </span>
          </div>
        </div>

        <div class="mt-4 form-floating">
          <input
            formControlName="password"
            type="password"
            class="form-control"
            name="password"
            id="floatingPassword"
            placeholder="Password"
            [(ngModel)]="service.datosUser.password"
          />
          <label class="text-dark" for="floatingPassword">Password</label>

          <div
            class="alert alert-danger mt-2"
            *ngIf="
              form.controls['password'].invalid &&
              (form.controls['password'].dirty ||
                form.controls['password'].touched)
            "
          >
            <span> The password is required </span>
          </div>
        </div>
        <div class="pt-4 bs-body-bg">
          <h6 class="txt text-white">
            Do you already have an account?
            <a routerLink="/login">Log In</a>
          </h6>
        </div>
        <button
          type="submit"
          class="btn_login btn btn-primary w-100 btn btn-lg text-white"
          [disabled]="form.pristine || form.invalid"
        >
          Continue
        </button>
      </form>
      <br />
      <br />
      <div class="back containe">
        <i class="bi bi-arrow-left-circle-fill back pe-2"></i>
        <a routerLink="">Back</a>
      </div>
    </div>
  </main>

  <!--Waves Container-->
  <div>
    <svg
      class="waves"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 24 150 28"
      preserveAspectRatio="none"
      shape-rendering="auto"
    >
      <defs>
        <path
          id="gentle-wave"
          d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"
        />
      </defs>
      <g class="parallax">
        <use
          xlink:href="#gentle-wave"
          x="48"
          y="0"
          fill="rgba(255,255,255,0.7"
        />
        <use
          xlink:href="#gentle-wave"
          x="48"
          y="3"
          fill="rgba(255,255,255,0.5)"
        />
        <use
          xlink:href="#gentle-wave"
          x="48"
          y="5"
          fill="rgba(255,255,255,0.3)"
        />
        <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
      </g>
    </svg>
  </div>
  <!--Waves end-->
</div>
<!--Header ends-->
